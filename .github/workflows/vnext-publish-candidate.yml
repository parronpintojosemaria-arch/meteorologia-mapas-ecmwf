# europe-domain: 40W-60E 22N-76N · regeneracion 2026-09-20
name: vNext · Candidato Pages · ECMWF · 3.128 mapas

# visual-2: paletas HD profesionales · 2026-09-18
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vnext-publish-candidate.yml'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-ecmwf-candidate
  cancel-in-progress: false

jobs:
  prepare:
    name: Seleccionar pasada ECMWF completa +360 h
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      cycle: ${{ steps.cycle.outputs.cycle }}
    steps:
      - name: Checkout destino
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar backend vNext
        run: |
          set -euo pipefail
          git clone --depth 1 --branch vnext-mapas-profesional \
            https://github.com/parronpintojosemaria-arch/meteorologia-mapas-backend.git backend

      - name: Dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar generadores ECMWF
        working-directory: backend
        run: |
          python -m py_compile scripts/vnext_ecmwf_data.py
          python -m py_compile scripts/vnext_ecmwf_render.py
          python -m py_compile scripts/vnext_ecmwf_generate.py
          python -m py_compile scripts/vnext_ecmwf_assemble.py
          python -m py_compile scripts/vnext_current_guard.py

      - name: Elegir ciclo ECMWF completo
        working-directory: backend
        run: python scripts/vnext_ecmwf_generate.py prepare

      - id: cycle
        name: Exportar ciclo
        working-directory: backend
        shell: bash
        run: |
          CYCLE=$(python -c "import json;print(json.load(open('vnext-full-out/ecmwf/prep.json'))['cycle'])")
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"
          echo "ECMWF ciclo seleccionado: $CYCLE"

  generate:
    name: Generar ${{ matrix.group }} · España 2400 · Europa 2800 · q92
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [surface, lower, upper]
    steps:
      - name: Checkout destino
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar backend vNext
        run: |
          set -euo pipefail
          git clone --depth 1 --branch vnext-mapas-profesional \
            https://github.com/parronpintojosemaria-arch/meteorologia-mapas-backend.git backend

      - name: Dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar grupo completo
        working-directory: backend
        run: python scripts/vnext_ecmwf_generate.py "${{ matrix.group }}" --cycle "${{ needs.prepare.outputs.cycle }}"

      - name: Guard del grupo
        working-directory: backend
        env:
          GROUP: ${{ matrix.group }}
          CYCLE: ${{ needs.prepare.outputs.cycle }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from PIL import Image
          expected={'surface':1088,'lower':1020,'upper':1020}
          group=os.environ['GROUP']; cycle=os.environ['CYCLE']
          root=Path('vnext-full-out/ecmwf/cycles')/cycle
          f=root/f'fragment-{group}.json'
          m=json.loads(f.read_text(encoding='utf-8'))
          assert m['status']=='ready' and m['production_changed'] is False
          assert m['expected_count']==expected[group] and len(m['files'])==expected[group]
          widths={'spain':2400,'europe':2800}
          for row in m['files']:
              p=root/row['path']
              assert p.is_file() and p.stat().st_size>100
              assert row['width']==widths[row['domain']] and row['height']>900
          for row in (m['files'][0],m['files'][len(m['files'])//2],m['files'][-1]):
              with Image.open(root/row['path']) as im:
                  im.verify()
          print('ECMWF GROUP OK',group,len(m['files']))
          PY

      - name: Subir grupo HD temporal
        uses: actions/upload-artifact@v4
        with:
          name: vnext-ecmwf-pages-${{ matrix.group }}
          path: backend/vnext-full-out/ecmwf/cycles/${{ needs.prepare.outputs.cycle }}
          retention-days: 1
          compression-level: 1

  build:
    name: Ensamblar · validar 3.128 · preparar Pages
    needs: [prepare, generate]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      cycle: ${{ needs.prepare.outputs.cycle }}
    steps:
      - name: Checkout destino
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar backend vNext
        run: |
          set -euo pipefail
          git clone --depth 1 --branch vnext-mapas-profesional \
            https://github.com/parronpintojosemaria-arch/meteorologia-mapas-backend.git backend

      - name: Pillow
        working-directory: backend
        run: python -m pip install --upgrade pillow

      - name: Descargar los tres grupos
        uses: actions/download-artifact@v4
        with:
          pattern: vnext-ecmwf-pages-*
          path: backend/vnext-full-merged/ecmwf
          merge-multiple: true

      - name: Validación completa ECMWF
        working-directory: backend
        run: python scripts/vnext_ecmwf_assemble.py

      - name: Guard de tamaño Pages
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('vnext-full-summary/ecmwf/report.json').read_text())
          assert r['status']=='ok' and r['maps']==3128 and r['production_changed'] is False
          assert r['fits_single_model_pages_repo'] is True
          assert float(r['image_mib']) < 940.0
          print('ECMWF PAGES OK · 3128 mapas ·',r['image_mib'],'MiB')
          PY

      - name: Preparar sitio candidato
        working-directory: backend
        env:
          CYCLE: ${{ needs.prepare.outputs.cycle }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "../site/cycles/$CYCLE"
          cp -a vnext-full-merged/ecmwf/. "../site/cycles/$CYCLE/"
          python scripts/vnext_current_guard.py \
            --model ecmwf \
            --cycle "$CYCLE" \
            --cycle-dir vnext-full-merged/ecmwf \
            --base-url 'https://parronpintojosemaria-arch.github.io/meteorologia-mapas-ecmwf' \
            --output ../site/current.json
          cat > ../site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Meteorología Interactiva · ECMWF IFS</title>
          <h1>Meteorología Interactiva · ECMWF IFS</h1>
          <p>Candidato vNext HD. Datos: ECMWF Open Data. 3.128 mapas.</p>
          <p><a href="current.json">current.json</a></p>
          HTML
          touch ../site/.nojekyll

      - name: Guard final candidato
        env:
          CYCLE: ${{ needs.prepare.outputs.cycle }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          c=json.loads(Path('site/current.json').read_text())
          assert c['status']=='ready' and c['model']=='ecmwf' and c['file_count']==3128
          assert c['cycle']==os.environ['CYCLE']
          assert Path('site/cycles',c['cycle'],'manifest.json').is_file()
          print('CURRENT CANDIDATO ECMWF OK',c['cycle'],c['file_count'])
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar candidato Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

  deploy:
    name: Publicar candidato aislado ECMWF
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar Pages
        id: deployment
        uses: actions/deploy-pages@v4
